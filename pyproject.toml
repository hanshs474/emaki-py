[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emaki"
version = "0.1.0"
description = "Official SDK for emaki (emaki.ai), the Japanese-language AI video generator for Seedance 2.5 and Seedance 2.0"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "emaki" }]
keywords = ["ai", "video-generation", "text-to-video", "image-to-video", "seedance", "seedance-2-5", "image-generation", "emaki"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Natural Language :: Japanese",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://emaki.ai/?utm_source=pypi&utm_medium=package"
"Seedance 2.5" = "https://emaki.ai/seedance-2-5"
"API keys" = "https://emaki.ai/settings/apikeys"
Source = "https://github.com/hanshs474/emaki-py"

[tool.setuptools.packages.find]
where = ["src"]
